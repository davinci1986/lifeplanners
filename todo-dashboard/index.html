<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LifePlanner Pro</title>
  <link rel="stylesheet" href="css/app.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

<!-- Sidebar -->
<nav class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="logo">
      <div class="logo-icon">LP</div>
      <div class="logo-text">
        <span class="logo-title">LifePlanner</span>
        <span class="logo-sub">Pro</span>
      </div>
    </div>
    <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
  </div>

  <div class="sidebar-section">
    <span class="sidebar-label">Overview</span>
    <a class="nav-item active" data-page="dashboard" onclick="navigateTo('dashboard')">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span>Dashboard</span>
      <span class="nav-badge" id="badge-reminders"></span>
    </a>
    <a class="nav-item" data-page="reminders" onclick="navigateTo('reminders')">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span>Reminders</span>
      <span class="nav-badge urgent" id="badge-reminder-count"></span>
    </a>
    <a class="nav-item" data-page="crm" onclick="navigateTo('crm')">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>CRM Contacts</span>
    </a>
  </div>

  <div class="sidebar-section">
    <span class="sidebar-label">Categories</span>
    <a class="nav-item" data-page="sales" onclick="navigateTo('sales')">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
      <span>Sales</span>
      <span class="nav-badge" id="badge-sales"></span>
    </a>
    <a class="nav-item" data-page="claims" onclick="navigateTo('claims')">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      <span>Claims</span>
      <span class="nav-badge" id="badge-claims"></span>
    </a>
    <a class="nav-item" data-page="servicing" onclick="navigateTo('servicing')">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93l-1.41 1.41M5.34 18.66l-1.41 1.41M20 12h-2M4 12H2M19.07 19.07l-1.41-1.41M5.34 5.34L3.93 3.93"/><circle cx="12" cy="12" r="8"/></svg>
      <span>Servicing</span>
      <span class="nav-badge" id="badge-servicing"></span>
    </a>
    <a class="nav-item" data-page="recruitment" onclick="navigateTo('recruitment')">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
      <span>Recruitment</span>
      <span class="nav-badge" id="badge-recruitment"></span>
    </a>
    <a class="nav-item" data-page="onboarding" onclick="navigateTo('onboarding')">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      <span>Onboarding</span>
      <span class="nav-badge" id="badge-onboarding"></span>
    </a>
    <a class="nav-item" data-page="snapwill" onclick="navigateTo('snapwill')">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      <span>Snapwill</span>
      <span class="nav-badge" id="badge-snapwill"></span>
    </a>
    <a class="nav-item" data-page="others" onclick="navigateTo('others')">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span>Others</span>
      <span class="nav-badge" id="badge-others"></span>
    </a>
  </div>

  <div class="sidebar-section">
    <span class="sidebar-label">Lists</span>
    <a class="nav-item" data-page="kiv" onclick="navigateTo('kiv')">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      <span>KIV Listing</span>
    </a>
    <a class="nav-item" data-page="followup" onclick="navigateTo('followup')">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      <span>Follow-Up</span>
    </a>
  </div>

  <div class="sidebar-footer">
    <!-- Google Drive Sync Status -->
    <div class="gd-sync-bar" id="gdSyncBar">
      <div class="gd-sync-status">
        <span class="gd-dot" id="gdDot"></span>
        <span class="gd-text" id="gdText">Not connected</span>
      </div>
      <button class="gd-connect-btn" id="gdConnectBtn" onclick="gdConnect()">🔗 Connect Drive</button>
    </div>
    <div class="gd-action-row">
      <button class="btn-secondary btn-sm" onclick="exportData()" title="Export JSON backup">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Backup
      </button>
      <button class="btn-secondary btn-sm" onclick="document.getElementById('importInput').click()" title="Import JSON">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Restore
      </button>
      <button class="btn-secondary btn-sm" onclick="openGDSetup()" title="Drive settings">⚙</button>
    </div>
    <input type="file" id="importInput" accept=".json" style="display:none" onchange="importData(event)" />
  </div>
</nav>

<!-- Main Content -->
<div class="main-wrapper" id="mainWrapper">
  <!-- Top Bar -->
  <header class="topbar">
    <div class="topbar-left">
      <button class="mobile-menu-btn" onclick="toggleSidebar()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="page-title" id="pageTitle">Dashboard</div>
    </div>
    <div class="topbar-right">
      <div class="search-bar">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="Search..." id="globalSearch" oninput="handleSearch(this.value)" />
      </div>
      <button class="icon-btn" onclick="navigateTo('reminders')" title="Reminders">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="icon-badge" id="topReminderBadge"></span>
      </button>
    </div>
  </header>

  <!-- Page Content -->
  <main class="content" id="content">
    <!-- Pages rendered here by JS -->
  </main>
</div>

<!-- ===================== MODALS ===================== -->

<!-- Case Detail Modal -->
<div class="modal-overlay" id="caseModal" onclick="closeCaseModal(event)">
  <div class="modal" id="caseModalInner">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="modalTitle">Case Detail</div>
        <div class="modal-subtitle" id="modalSubtitle"></div>
      </div>
      <button class="modal-close" onclick="closeCaseModalBtn()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modalBody">
      <!-- Dynamic content -->
    </div>
  </div>
</div>

<!-- Add/Edit Contact Modal -->
<div class="modal-overlay" id="contactModal" onclick="closeContactModal(event)">
  <div class="modal modal-sm" id="contactModalInner">
    <div class="modal-header">
      <div class="modal-title" id="contactModalTitle">New Contact</div>
      <button class="modal-close" onclick="closeContactModalBtn()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="contactModalBody"></div>
  </div>
</div>

<!-- Confirm Dialog -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal modal-xs">
    <div class="modal-header">
      <div class="modal-title" id="confirmTitle">Confirm</div>
    </div>
    <div class="modal-body">
      <p id="confirmMsg" style="color:var(--text-secondary);margin-bottom:20px;"></p>
      <div class="btn-row">
        <button class="btn-secondary" onclick="closeConfirm(false)">Cancel</button>
        <button class="btn-danger" id="confirmOkBtn" onclick="closeConfirm(true)">Confirm</button>
      </div>
    </div>
  </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<!-- Reminder Alert -->
<div class="reminder-alert" id="reminderAlert" style="display:none">
  <div class="reminder-alert-icon">🔔</div>
  <div class="reminder-alert-body">
    <div class="reminder-alert-title" id="reminderAlertTitle"></div>
    <div class="reminder-alert-text" id="reminderAlertText"></div>
  </div>
  <button onclick="dismissReminderAlert()">✕</button>
</div>

<!-- Scripts -->
<script src="js/gdrive.js"></script>
<script src="js/data.js"></script>
<script src="js/sounds.js"></script>
<script src="js/utils.js"></script>
<script src="js/whatsapp.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/sales.js"></script>
<script src="js/claims.js"></script>
<script src="js/servicing.js"></script>
<script src="js/recruitment.js"></script>
<script src="js/onboarding.js"></script>
<script src="js/snapwill.js"></script>
<script src="js/others.js"></script>
<script src="js/crm.js"></script>
<script src="js/reminders.js"></script>
<script src="js/app.js"></script>
</body>
</html>
